[pytest]
# 测试路径
testpaths = tests

# 测试文件模式
python_files = test_*.py

# 测试类模式
python_classes = Test*

# 测试函数模式
python_functions = test_*

# 注册自定义 marks
markers =
    smoke: 冒烟测试 - 核心主流程快速验证
    regression: 全量回归测试 - 覆盖所有接口及边界场景
    retry(max_attempts=3, delay=5): 超时自动重试 - 可自定义重试次数和间隔
    timeout(seconds): 单个测试超时限制 - 超时后抛出 TimeoutException

# 日志配置
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s | %(levelname)-8s | %(name)s | %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S

log_file = logs/pytest.log
log_file_level = DEBUG
log_file_format = %(asctime)s | %(levelname)-8s | %(name)s | %(filename)s:%(lineno)d | %(message)s
log_file_date_format = %Y-%m-%d %H:%M:%S

# Allure 配置
addopts =
    -v
    --tb=long
    --strict-markers
    --alluredir=reports/allure-results
    --clean-alluredir

# 忽略警告
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
