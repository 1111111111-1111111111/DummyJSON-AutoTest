# ============================================================
# DummyJSON API 自动化测试 — CI/CD 工作流
# ============================================================
# 触发策略：
#   1. push 到 main/master/develop 分支 → 全量回归测试
#   2. Pull Request 到 main → 仅冒烟测试（快速反馈）
#   3. 每天定时（北京时间 02:00）→ 全量回归测试
#   4. 手动触发（workflow_dispatch）→ 可选执行模式
# ============================================================
name: API 自动化测试 CI/CD

on:
  push:
    branches: [ main, master, develop ]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'testdata/**'
      - 'config/**'
      - 'requirements.txt'
      - 'pytest.ini'
      - 'run_tests.py'
      - '.github/workflows/ci-cd.yml'
  pull_request:
    branches: [ main, master ]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'testdata/**'
      - 'config/**'
      - 'requirements.txt'
      - 'pytest.ini'
      - 'run_tests.py'
  schedule:
    # 每天 UTC 18:00 执行 = 北京时间次日 02:00（夜间低峰期全量回归）
    - cron: '0 18 * * *'
  workflow_dispatch:
    inputs:
      test_mode:
        description: '测试执行模式'
        required: true
        type: choice
        default: 'all'
        options:
          - all
          - smoke
          - regression

# 同一分支的并发运行自动取消旧任务，节省资源
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# 权限：GHCR 镜像推送 + gh-pages 分支推送 + Pages 部署
permissions:
  contents: write
  packages: write
  pages: write
  id-token: write

jobs:
  # ----------------------------------------------------------
  # Job 1: 代码风格检查（flake8）— 快速门禁，所有场景都跑
  # ----------------------------------------------------------
  lint:
    name: 代码风格检查 (flake8)
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 安装依赖
        run: pip install -r requirements.txt

      - name: 运行 flake8 代码风格检查
        run: |
          flake8 src/ tests/ --max-line-length=120 --extend-ignore=E203,W503 || \
          echo "::warning::flake8 发现风格问题，不阻断流水线（仅提示）"

  # ----------------------------------------------------------
  # Job 2: 冒烟测试 — push/PR/手动均执行（快速验证核心主流程）
  # ----------------------------------------------------------
  smoke-test:
    name: 冒烟测试 (Smoke)
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 安装依赖
        run: pip install -r requirements.txt

      - name: 创建配置目录与 .env
        run: |
          mkdir -p config reports/allure-results logs
          echo "ENV=dev" > config/.env

      - name: 执行冒烟测试
        run: python run_tests.py --mode smoke

      - name: 上传 Allure 测试结果
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results-smoke
          path: reports/allure-results/
          retention-days: 14

      - name: 上传断言失败截图
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots-smoke
          path: screenshots/
          retention-days: 30
          if-no-files-found: ignore

      - name: 上传测试日志
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-logs-smoke
          path: logs/
          retention-days: 7

  # ----------------------------------------------------------
  # Job 3: 全量回归测试 — 仅 push到main / 定时 / 手动all 时执行
  # 依赖冒烟测试通过（与 run_tests.py --mode all 的门禁逻辑一致）
  # ----------------------------------------------------------
  regression-test:
    name: 全量回归测试 (Regression)
    runs-on: ubuntu-latest
    needs: smoke-test
    if: |
      github.event_name == 'push' ||
      github.event_name == 'schedule' ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.test_mode != 'smoke')
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 安装依赖
        run: pip install -r requirements.txt

      - name: 创建配置目录与 .env
        run: |
          mkdir -p config reports/allure-results logs
          echo "ENV=dev" > config/.env

      - name: 执行全量回归测试
        run: python run_tests.py --mode regression

      - name: 上传 Allure 测试结果
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results-regression
          path: reports/allure-results/
          retention-days: 14

      - name: 上传断言失败截图
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots-regression
          path: screenshots/
          retention-days: 30
          if-no-files-found: ignore

      - name: 上传测试日志
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-logs-regression
          path: logs/
          retention-days: 7

  # ----------------------------------------------------------
  # Job 4: Docker 镜像构建与推送 — 仅 push到main / 定时 后执行
  # 镜像推送到 GitHub Container Registry (ghcr.io)
  # ----------------------------------------------------------
  docker-build:
    name: Docker 镜像构建推送 (GHCR)
    runs-on: ubuntu-latest
    needs: regression-test
    if: |
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      github.event_name == 'schedule'
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 登录 GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 提取镜像元数据（仓库名 + 短 SHA + latest）
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=,format=short
            type=schedule,prefix=nightly-

      - name: 构建并推送镜像
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            TEST_MODE=all

  # ----------------------------------------------------------
  # Job 5: Allure 报告部署到 GitHub Pages (gh-pages 分支)
  # push / 定时 / 手动触发后，将 Allure HTML 报告推送到 gh-pages 分支
  # 报告地址: https://<username>.github.io/<repo-name>/
  # ----------------------------------------------------------
  deploy-pages:
    name: 部署 Allure 报告到 GitHub Pages
    runs-on: ubuntu-latest
    needs: [ smoke-test, regression-test ]
    # 无论测试成功/失败都部署报告（失败时更需要查看报告）
    if: always() && needs.smoke-test.result != 'skipped'
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 下载 Allure 结果 (Smoke)
        uses: actions/download-artifact@v4
        with:
          name: allure-results-smoke
          path: allure-results/raw

      - name: 下载 Allure 结果 (Regression)
        if: needs.regression-test.result == 'success' || needs.regression-test.result == 'failure'
        uses: actions/download-artifact@v4
        with:
          name: allure-results-regression
          path: allure-results/regression

      - name: 下载断言失败截图 (Smoke)
        uses: actions/download-artifact@v4
        with:
          name: screenshots-smoke
          path: screenshots/smoke
        continue-on-error: true

      - name: 下载断言失败截图 (Regression)
        if: needs.regression-test.result == 'success' || needs.regression-test.result == 'failure'
        uses: actions/download-artifact@v4
        with:
          name: screenshots-regression
          path: screenshots/regression
        continue-on-error: true

      - name: 安装 Allure CLI
        run: |
          wget -q https://github.com/allure-framework/allure2/releases/download/2.27.0/allure-2.27.0-linux.tar.gz
          tar -xzf allure-2.27.0-linux.tar.gz
          echo "$(pwd)/allure-2.27.0/bin" >> $GITHUB_PATH

      - name: 获取上一次 Allure 历史（用于趋势图）
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: gh-pages-history
        continue-on-error: true

      - name: 生成 Allure HTML 报告
        run: |
          # 合并 smoke + regression 的 allure-results
          mkdir -p allure-results-merged
          cp -r allure-results/raw/* allure-results-merged/ 2>/dev/null || true
          if [ -d allure-results/regression ]; then
            cp -r allure-results/regression/* allure-results-merged/ 2>/dev/null || true
          fi

          # 恢复上一次的 history（用于趋势图）
          if [ -d gh-pages-history/history ]; then
            cp -r gh-pages-history/history allure-results-merged/history
            echo "已恢复上一次 Allure 历史"
          else
            echo "首次运行，无历史数据"
          fi

          # 生成报告
          allure generate allure-results-merged -o allure-report --clean

          # 保留 history 供下次使用
          cp -r allure-results-merged/history allure-report/history 2>/dev/null || true

          # 将截图证据复制到报告中（可在浏览器中直接访问）
          mkdir -p allure-report/screenshots
          cp -r screenshots/* allure-report/screenshots/ 2>/dev/null || true

      - name: 部署到 gh-pages 分支
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: allure-report
          publish_branch: gh-pages
          user_name: 'github-actions[bot]'
          user_email: 'github-actions[bot]@users.noreply.github.com'
          commit_message: 'deploy: Allure report ${{ github.run_id }}'

      - name: 输出报告地址
        run: |
          REPO_OWNER=$(echo ${{ github.repository }} | cut -d'/' -f1)
          REPO_NAME=$(echo ${{ github.repository }} | cut -d'/' -f2)
          echo "::notice::Allure 报告已部署到 https://${REPO_OWNER}.github.io/${REPO_NAME}/"

  # ----------------------------------------------------------
  # Job 6: 定时测试失败通知（仅 schedule 触发时）
  # 通过 GitHub Actions 自带的 Job Summary + 仓库 Issue 提醒
  # ----------------------------------------------------------
  notify-failure:
    name: 失败通知
    runs-on: ubuntu-latest
    needs: [ smoke-test, regression-test, deploy-pages ]
    if: |
      failure() && github.event_name == 'schedule'
    steps:
      - name: 创建 Issue 通知定时任务失败
        uses: actions/github-script@v7
        with:
          script: |
            const date = new Date().toLocaleString('zh-CN', { timeZone: 'Asia/Shanghai' });
            const repo = context.repo.owner + '/' + context.repo.repo;
            const reportUrl = `https://${context.repo.owner}.github.io/${context.repo.repo}/`;
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `🚨 定时 API 测试失败 — ${date}`,
              body: [
                `## 定时全量回归测试未通过`,
                ``,
                `- **失败时间**: ${date}`,
                `- **触发事件**: schedule (cron 定时)`,
                `- **工作流**: [${context.runId}](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})`,
                `- **分支**: ${context.ref}`,
                `- **Allure 报告**: [${reportUrl}](${reportUrl})`,
                `- **失败截图**: 见报告中 screenshots 目录或 Actions artifact`,
                ``,
                `请查看 Allure 报告与失败截图定位失败用例。`,
                ``,
                `> 此 Issue 由 CI/CD 自动创建，问题修复后可关闭。`
              ].join('\n'),
              labels: ['ci-failure', 'automated']
            });
            core.info('已创建失败通知 Issue');
