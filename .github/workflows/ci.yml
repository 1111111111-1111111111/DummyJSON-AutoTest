# ============================================================
# DummyJSON 自动化测试 — Docker 优先的 CI/CD Pipeline
# ============================================================
name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
    paths-ignore:
      - '**.md'
      - 'docs/**'
  pull_request:
    branches: [ main ]
  schedule:
    - cron: '0 18 * * *'
  workflow_dispatch:
    inputs:
      test_mode:
        description: '测试模式'
        default: 'all'
        type: choice
        options: [all, smoke, regression]

env:
  REGISTRY: ghcr.io
  ALLURE_VERSION: 2.27.0

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  packages: write

jobs:
  # ============================================================
  # Stage 1: 构建测试镜像（唯一需要 checkout 和 Docker 的上游）
  # ============================================================
  build:
    name: 🐳 构建测试镜像
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      image: ${{ steps.image_name.outputs.image }}
      short-sha: ${{ steps.sha.outputs.short }}
      image-tag: ${{ steps.image_name.outputs.image }}:${{ steps.sha.outputs.short }}
    steps:
      - uses: actions/checkout@v4

      - name: 转换为小写镜像名
        id: image_name
        run: |
          REPO_LOWER=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          echo "image=${{ env.REGISTRY }}/$REPO_LOWER" >> $GITHUB_OUTPUT

      - name: 计算短 SHA
        id: sha
        run: echo "short=${GITHUB_SHA::7}" >> $GITHUB_OUTPUT

      - name: 设置 Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 登录 GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 提取元数据
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image_name.outputs.image }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=,format=short
            type=schedule,prefix=nightly-
            type=ref,event=branch

      - name: 构建并推送（GHA 层缓存）
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            ALLURE_VERSION=${{ env.ALLURE_VERSION }}

      - name: 验证镜像可用性
        run: |
          IMAGE="${{ steps.image_name.outputs.image }}:${{ steps.sha.outputs.short }}"
          docker pull "$IMAGE"
          echo "── python ──"; docker run --rm "$IMAGE" python --version
          echo "── pytest ──"; docker run --rm "$IMAGE" pytest --version
          echo "── allure ──"; docker run --rm "$IMAGE" allure --version

  # ============================================================
  # Stage 2: Lint —— 镜像内执行，宿主机零安装
  # ============================================================
  lint:
    name: 🔍 代码风格检查
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: build
    steps:
      - name: 拉取镜像
        run: |
          IMAGE_TAG="${{ needs.build.outputs.image }}:${{ needs.build.outputs.short-sha }}"
          echo "拉取镜像: $IMAGE_TAG"
          docker pull "$IMAGE_TAG"

      - name: flake8 + black（镜像内执行，不阻断）
        run: |
          IMAGE_TAG="${{ needs.build.outputs.image }}:${{ needs.build.outputs.short-sha }}"
          docker run --rm "$IMAGE_TAG" sh -c "
            flake8 src/ tests/ --max-line-length=120 --extend-ignore=E203,W503 \
              && echo '✅ flake8 通过' || echo '::warning::flake8 存在风格问题（不阻断）'
            black --check -q src/ tests/ \
              && echo '✅ black 通过' || echo '::warning::black 存在格式化问题（不阻断）'
            true
          "

  # ============================================================
  # Stage 3: 冒烟测试（镜像内执行，强制门禁）
  # ============================================================
  smoke:
    name: 🔥 冒烟测试
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: build
    steps:
      - name: 拉取镜像
        run: |
          IMAGE="${{ needs.build.outputs.image }}"
          SHA="${{ needs.build.outputs.short-sha }}"
          IMAGE_TAG="${IMAGE}:${SHA}"

          if [ -z "$IMAGE" ] || [ -z "$SHA" ]; then
            echo "❌ 镜像名或 SHA 为空: IMAGE=$IMAGE, SHA=$SHA"
            exit 1
          fi

          echo "拉取镜像: $IMAGE_TAG"
          if ! docker pull "$IMAGE_TAG"; then
            echo "❌ 镜像拉取失败: $IMAGE_TAG"
            exit 1
          fi
          echo "IMAGE_TAG=$IMAGE_TAG" >> $GITHUB_ENV

      - name: 准备报告目录
        run: mkdir -p reports

      - name: 执行冒烟测试（镜像内）
        id: smoke
        run: |
          docker run --rm \
            -v "${{ github.workspace }}/reports:/app/reports" \
            "${{ env.IMAGE_TAG }}" \
            sh -c "pytest -v -m smoke --alluredir=reports/allure-results"

      - name: 生成 Allure 结果（镜像内）
        if: always()
        run: |
          docker run --rm \
            -v "${{ github.workspace }}/reports:/app/reports" \
            "${{ env.IMAGE_TAG }}" \
            sh -c "allure generate reports/allure-results -o reports/allure-report --clean || true"

      - name: 上传结果
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-results
          path: reports/
          retention-days: 14

  # ============================================================
  # Stage 4: 全量回归测试（镜像内执行，允许失败）
  # ============================================================
  regression:
    name: 📊 全量回归测试
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [build, smoke]
    if: |
      always() &&
      needs.smoke.result == 'success' &&
      (github.event_name == 'push' ||
       github.event_name == 'schedule' ||
       github.event.inputs.test_mode == 'all' ||
       github.event.inputs.test_mode == 'regression')
    continue-on-error: true
    steps:
      - name: 拉取镜像
        run: |
          IMAGE="${{ needs.build.outputs.image }}"
          SHA="${{ needs.build.outputs.short-sha }}"
          IMAGE_TAG="${IMAGE}:${SHA}"

          if [ -z "$IMAGE" ] || [ -z "$SHA" ]; then
            echo "❌ 镜像名或 SHA 为空: IMAGE=$IMAGE, SHA=$SHA"
            exit 1
          fi

          echo "拉取镜像: $IMAGE_TAG"
          if ! docker pull "$IMAGE_TAG"; then
            echo "❌ 镜像拉取失败: $IMAGE_TAG"
            exit 1
          fi
          echo "IMAGE_TAG=$IMAGE_TAG" >> $GITHUB_ENV

      - name: 准备报告目录
        run: mkdir -p reports

      - name: 执行全量回归（镜像内）
        id: regression
        run: |
          docker run --rm \
            -v "${{ github.workspace }}/reports:/app/reports" \
            "${{ env.IMAGE_TAG }}" \
            sh -c "pytest -v --alluredir=reports/allure-results || true"

      - name: 生成 Allure 结果（镜像内）
        if: always()
        run: |
          docker run --rm \
            -v "${{ github.workspace }}/reports:/app/reports" \
            "${{ env.IMAGE_TAG }}" \
            sh -c "allure generate reports/allure-results -o reports/allure-report --clean || true"

      - name: 上传结果
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: regression-results
          path: reports/
          retention-days: 14

  # ============================================================
  # Stage 5: Allure 报告生成与部署
  # ============================================================
  report:
    name: 📈 部署 Allure 报告
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [build, smoke, regression]
    if: always() && needs.smoke.result != 'skipped'
    steps:
      - name: 下载 Smoke 结果
        uses: actions/download-artifact@v4
        with:
          name: smoke-results
          path: allure-results/smoke
        continue-on-error: true

      - name: 下载 Regression 结果
        uses: actions/download-artifact@v4
        with:
          name: regression-results
          path: allure-results/regression
        continue-on-error: true

      - name: 获取历史趋势
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: gh-pages-history
        continue-on-error: true

      - name: 生成 Allure 报告（镜像内执行）
        run: |
          IMAGE_TAG="${{ needs.build.outputs.image }}:${{ needs.build.outputs.short-sha }}"

          if [ -z "${{ needs.build.outputs.image }}" ] || [ -z "${{ needs.build.outputs.short-sha }}" ]; then
            echo "❌ 镜像名或 SHA 为空"
            exit 1
          fi

          echo "拉取镜像: $IMAGE_TAG"
          docker pull "$IMAGE_TAG"

          mkdir -p allure-results-merged
          docker run --rm \
            -v "${{ github.workspace }}:/work" -w /work \
            "$IMAGE_TAG" sh -c "
              cp -r allure-results/smoke/allure-results/. allure-results-merged/ 2>/dev/null || true
              cp -r allure-results/regression/allure-results/. allure-results-merged/ 2>/dev/null || true
              if [ -d gh-pages-history/allure-report/history ]; then
                cp -r gh-pages-history/allure-report/history allure-results-merged/
              fi
              allure generate allure-results-merged -o allure-report --clean
            "

      - name: 部署到 gh-pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: allure-report
          publish_branch: gh-pages
          force_orphan: true
          commit_message: '📊 Allure Report #${{ github.run_number }}'

  # ============================================================
  # Stage 6: 结果通知
  # ============================================================
  notify:
    name: 📢 测试结果通知
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [smoke, regression, report]
    if: always()
    steps:
      - name: 发送通知
        env:
          WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}
        run: |
          if [ -z "$WEBHOOK_URL" ]; then
            echo "⚠️ 跳过通知（未配置 Webhook）"
            exit 0
          fi

          SMOKE_STATUS="${{ needs.smoke.result }}"
          REGRESSION_STATUS="${{ needs.regression.result }}"
          REPORT_URL="https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/"

          if [ "$SMOKE_STATUS" = "success" ]; then
            EMOJI="✅"
            TITLE="冒烟测试通过"
          else
            EMOJI="🔴"
            TITLE="冒烟测试失败"
          fi

          MSG=$(cat <<EOF
          {
            "msg_type": "post",
            "content": {
              "post": {
                "zh_cn": {
                  "title": "${EMOJI} DummyJSON 测试报告",
                  "content": [
                    [
                      {"tag": "text", "text": "📦 仓库: "},
                      {"tag": "a", "text": "${{ github.repository }}", "href": "${{ github.server_url }}/${{ github.repository }}"},
                      {"tag": "text", "text": "\n"}
                    ],
                    [
                      {"tag": "text", "text": "🌿 分支: ${{ github.ref_name }}\n"}
                    ],
                    [
                      {"tag": "text", "text": "🔖 提交: "},
                      {"tag": "a", "text": "${{ github.sha }}", "href": "${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}"},
                      {"tag": "text", "text": "\n"}
                    ],
                    [
                      {"tag": "text", "text": "🔥 冒烟测试: ${SMOKE_STATUS}\n"}
                    ],
                    [
                      {"tag": "text", "text": "📊 回归测试: ${REGRESSION_STATUS}\n"}
                    ],
                    [
                      {"tag": "text", "text": "\n"}
                    ],
                    [
                      {"tag": "text", "text": "📈 "},
                      {"tag": "a", "text": "查看 Allure 报告", "href": "${REPORT_URL}"},
                      {"tag": "text", "text": " | "},
                      {"tag": "a", "text": "查看 Actions", "href": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"}
                    ]
                  ]
                }
              }
            }
          }
          EOF
          )

          curl -s -X POST -H "Content-Type: application/json" -d "$MSG" "$WEBHOOK_URL" || \
          echo "⚠️ 通知发送失败"

          echo "✅ 通知已发送"