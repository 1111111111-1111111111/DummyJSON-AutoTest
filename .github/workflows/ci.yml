# ============================================================
# SauceDemo 自动化测试 — 企业级 CI/CD Pipeline
# ============================================================
# 流程：
#   1. Lint → 代码风格检查
#   2. Build → Docker 镜像构建（缓存复用）
#   3. Smoke → 容器内执行冒烟测试（强制门禁）
#   4. Regression → 容器内执行全量回归（允许失败）
#   5. Report → Allure 报告生成与部署
#   6. Notify → 测试结果通知（飞书/钉钉/企业微信）
#   7. Push → 镜像推送 GHCR（仅在 main 分支）
# ============================================================
name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
    paths-ignore:
      - '**.md'
      - 'docs/**'
  pull_request:
    branches: [ main ]
  schedule:
    - cron: '0 18 * * *'
  workflow_dispatch:
    inputs:
      test_mode:
        description: '测试模式'
        default: 'all'
        type: choice
        options: [all, smoke, regression]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ toLower(github.repository) }}  # 强制转换为小写
  ALLURE_VERSION: 2.27.0

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  packages: write
  pages: write
  id-token: write

jobs:
  # ============================================================
  # Stage 1: 代码质量检查（快速反馈）
  # ============================================================
  lint:
    name: 🔍 代码风格检查
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 安装依赖
        run: pip install -r requirements.txt

      - name: 运行 flake8
        run: |
          flake8 src/ tests/ --max-line-length=120 --extend-ignore=E203,W503 || \
          echo "::warning::代码风格问题（不阻断）"

      - name: 运行 black（格式化检查）
        run: |
          pip install black
          black --check src/ tests/ || echo "::warning::格式化问题（不阻断）"

  # ============================================================
  # Stage 2: Docker 镜像构建（带缓存）
  # ============================================================
  build:
    name: 🐳 构建 Docker 镜像
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: lint
    outputs:
      image-tag: ${{ steps.meta.outputs.tags }}
      cache-hit: ${{ steps.cache.outputs.cache-hit }}
    steps:
      - uses: actions/checkout@v4

      - name: 设置 Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 登录 GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 提取元数据
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=,format=short
            type=schedule,prefix=nightly-
            type=ref,event=branch

      - name: 构建并推送
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            ALLURE_VERSION=${{ env.ALLURE_VERSION }}

  # ============================================================
  # Stage 3: 冒烟测试（容器内执行，强制门禁）
  # ============================================================
  smoke:
    name: 🔥 冒烟测试
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: build
    steps:
      - uses: actions/checkout@v4

      - name: 拉取镜像
        run: |
          docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest || \
          docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}

      - name: 执行冒烟测试
        id: smoke
        run: |
          docker run --rm \
            -e TEST_MODE=smoke \
            -v ${{ github.workspace }}/reports:/app/reports \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest || \
          docker run --rm \
            -e TEST_MODE=smoke \
            -v ${{ github.workspace }}/reports:/app/reports \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}

      - name: 上传结果
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-results
          path: reports/
          retention-days: 14

  # ============================================================
  # Stage 4: 全量回归测试（容器内执行，允许失败）
  # ============================================================
  regression:
    name: 📊 全量回归测试
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: smoke
    if: |
      always() &&
      needs.smoke.result == 'success' &&
      (github.event_name == 'push' || 
       github.event_name == 'schedule' ||
       github.event.inputs.test_mode == 'all' ||
       github.event.inputs.test_mode == 'regression')
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: 拉取镜像
        run: |
          docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest || \
          docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}

      - name: 执行全量回归
        run: |
          docker run --rm \
            -e TEST_MODE=all \
            -v ${{ github.workspace }}/reports:/app/reports \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest || \
          docker run --rm \
            -e TEST_MODE=all \
            -v ${{ github.workspace }}/reports:/app/reports \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }} || \
          echo "::warning::回归测试存在失败用例"

      - name: 上传结果
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: regression-results
          path: reports/
          retention-days: 14

  # ============================================================
  # Stage 5: Allure 报告生成与部署
  # ============================================================
  report:
    name: 📈 部署 Allure 报告
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [smoke, regression]
    if: always() && needs.smoke.result != 'skipped'
    steps:
      - uses: actions/checkout@v4

      - name: 下载 Smoke 结果
        uses: actions/download-artifact@v4
        with:
          name: smoke-results
          path: allure-results/smoke
        continue-on-error: true

      - name: 下载 Regression 结果
        uses: actions/download-artifact@v4
        with:
          name: regression-results
          path: allure-results/regression
        continue-on-error: true

      - name: 安装 Allure
        run: |
          wget -q https://github.com/allure-framework/allure2/releases/download/${{ env.ALLURE_VERSION }}/allure-${{ env.ALLURE_VERSION }}.tgz
          tar -xzf allure-${{ env.ALLURE_VERSION }}.tgz
          echo "$(pwd)/allure-${{ env.ALLURE_VERSION }}/bin" >> $GITHUB_PATH

      - name: 获取历史趋势
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: gh-pages-history
        continue-on-error: true

      - name: 生成报告
        run: |
          mkdir -p allure-results-merged
          cp -r allure-results/smoke/allure-results/* allure-results-merged/ 2>/dev/null || true
          cp -r allure-results/regression/allure-results/* allure-results-merged/ 2>/dev/null || true

          if [ -d gh-pages-history/allure-report/history ]; then
            cp -r gh-pages-history/allure-report/history allure-results-merged/history
          fi

          allure generate allure-results-merged -o allure-report --clean

      - name: 部署到 gh-pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: allure-report
          publish_branch: gh-pages
          force_orphan: true
          commit_message: '📊 Allure Report #${{ github.run_number }}'

  # ============================================================
  # Stage 6: 结果通知（飞书/钉钉/企业微信）
  # ============================================================
  notify:
    name: 📢 测试结果通知
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [smoke, regression, report]
    if: always()
    steps:
      - name: 发送通知
        env:
          WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}
        run: |
          if [ -z "$WEBHOOK_URL" ]; then
            echo "⚠️ 跳过通知（未配置 Webhook）"
            exit 0
          fi

          SMOKE_STATUS="${{ needs.smoke.result }}"
          REGRESSION_STATUS="${{ needs.regression.result }}"
          REPORT_URL="https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/"

          if [ "$SMOKE_STATUS" = "success" ]; then
            EMOJI="✅"
            TITLE="冒烟测试通过"
          else
            EMOJI="🔴"
            TITLE="冒烟测试失败"
          fi

          MSG=$(cat <<EOF
          {
            "msg_type": "post",
            "content": {
              "post": {
                "zh_cn": {
                  "title": "${EMOJI} SauceDemo 测试报告",
                  "content": [
                    [
                      {"tag": "text", "text": "📦 仓库: "},
                      {"tag": "a", "text": "${{ github.repository }}", "href": "${{ github.server_url }}/${{ github.repository }}"},
                      {"tag": "text", "text": "\n"}
                    ],
                    [
                      {"tag": "text", "text": "🌿 分支: ${{ github.ref_name }}\n"}
                    ],
                    [
                      {"tag": "text", "text": "🔖 提交: "},
                      {"tag": "a", "text": "${{ github.sha }}", "href": "${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}"},
                      {"tag": "text", "text": "\n"}
                    ],
                    [
                      {"tag": "text", "text": "🔥 冒烟测试: ${SMOKE_STATUS}\n"}
                    ],
                    [
                      {"tag": "text", "text": "📊 回归测试: ${REGRESSION_STATUS}\n"}
                    ],
                    [
                      {"tag": "text", "text": "\n"}
                    ],
                    [
                      {"tag": "text", "text": "📈 "},
                      {"tag": "a", "text": "查看 Allure 报告", "href": "${REPORT_URL}"},
                      {"tag": "text", "text": " | "},
                      {"tag": "a", "text": "查看 Actions", "href": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"}
                    ]
                  ]
                }
              }
            }
          }
          EOF
          )

          curl -s -X POST -H "Content-Type: application/json" -d "$MSG" "$WEBHOOK_URL"
          echo "✅ 通知已发送"