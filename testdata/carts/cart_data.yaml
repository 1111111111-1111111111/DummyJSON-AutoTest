- test_id: cart_add_01
  description: 添加有效购物车
  data:
    userId: 1
    products:
      - id: 1
        quantity: 2
      - id: 2
        quantity: 1
  expected_status: 200

- test_id: cart_add_empty_products
  description: 添加空产品列表的购物车
