# ============================================================
# docker-compose.yml — DummyJSON API 测试本地容器化运行
# 用途：一键构建并运行测试容器，报告挂载到宿主机
# 使用：
#   docker compose up --build          # 全量测试（默认 all）
#   TEST_MODE=smoke docker compose up --build    # 仅冒烟
# ============================================================
services:
  api-test:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        TEST_MODE: ${TEST_MODE:-all}
    image: dummyjson-api-testing:latest
    container_name: dummyjson-api-test
    environment:
      - TEST_MODE=${TEST_MODE:-all}
      - ENV=dev
    volumes:
      # 测试报告挂载到宿主机，便于本地查看
      - ./reports:/app/reports
      - ./logs:/app/logs
    # CI 模式：测试完即退出，不常驻
    restart: "no"
